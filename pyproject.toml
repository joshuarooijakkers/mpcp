[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpcp"
version = "0.1.0"
description = "Martingale Posterior Cox Processes (MPCP) for predictive Bayesian inference of Cox process intensities"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joshua Rooijakkers" }, { name = "Edwin Fong" }]
requires-python = ">=3.10"
# Versions used for the paper. For a GPU, install jax[cuda12]==0.6.2 instead of jax.
dependencies = [
    "jax==0.6.2",
    "numpy==1.26.4",
    "scipy==1.12.0",
]

[project.optional-dependencies]
# GP-based baselines (mpcp.baselines)
baselines = [
    "gpflow==2.11.1",
    "tensorflow==2.21.0",
    "tensorflow-probability==0.25.0",
    "tf-keras==2.21.0",
    "vbpp @ git+https://github.com/st--/vbpp@26c2a71101475c4480cb7af6166f45351470613f",
]
# Running the experiments and making the figures and tables (experiments/)
experiments = [
    "hydra-core==1.3.2",
    "scikit-learn==1.7.2",
    "pandas==2.3.3",
    "matplotlib==3.10.9",
    "geopandas==1.1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mpcp", "mpcp.*"]
